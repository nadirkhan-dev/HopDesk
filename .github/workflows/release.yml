# Publishes installable packages to GitHub Releases: an AppImage and a .deb for
# Linux, and a .dmg for each kind of Mac.
#
# Every package is built, then installed or started and tested, and only if all
# of them pass is anything published. A package nobody started is a package
# nobody tested.
#
# The Mac builds are signed ad hoc, not with a Developer ID: macOS asks before
# the first launch (the release notes say how to get past it). What a CI Mac
# can and cannot prove is written in apps/desktop/test/packaged-macos.test.mjs.
#
# Windows is absent: HopDesk has no Host backend for Windows at all.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for the release, e.g. v0.1.0 (created if it does not exist)"
        required: true
        type: string
      publish:
        description: "Publish the release (off: build and test every package, publish nothing)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  linux:
    name: Linux packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libfuse2t64: needed to mount the AppImage in order to test it.
          # tigervnc-standalone-server: the X displays the packaged app runs against.
          sudo apt-get install -y --no-install-recommends \
            libxtst6 libnss3 libasound2t64 libgtk-3-0t64 libfuse2t64 \
            tigervnc-standalone-server

      - name: Build the AppImage and the .deb
        run: bash packaging/build-appimage.sh

      - name: Start the packaged app and connect two of them
        run: |
          scripts/test-displays.sh
          # HOPDESK_REQUIRE_PACKAGE=1 turns "no package to test" into a failure
          # rather than a silent pass, and the test asserts it is driving the
          # AppImage rather than the development build.
          DISPLAY=:31 HOPDESK_REQUIRE_PACKAGE=1 HOPDESK_HOST_DISPLAY=:31 HOPDESK_VIEWER_DISPLAY=:32 \
            node --test --test-timeout=300000 apps/desktop/test/packaged.test.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist-packages/*.AppImage
            dist-packages/*.deb
          if-no-files-found: error

  macos:
    name: macOS .dmg (${{ matrix.arch }})
    # Apple Silicon builds both: the Intel one carries koffi's Intel module
    # (build-macos.sh installs it) and is tested under Rosetta.
    runs-on: macos-14
    # A hung app must not hold a runner for hours.
    timeout-minutes: 30
    env:
      # A certificate of our own, so that macOS recognises each build as the
      # same app and keeps the permissions granted to the last one. Absent from
      # a fork, or before it is set up, and then the build signs itself ad hoc
      # exactly as before.
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      SIGN_IDENTITY: HopDesk Self Signed
    strategy:
      fail-fast: true
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Rosetta, to run the Intel build
        if: matrix.arch == 'x64'
        run: |
          arch -x86_64 /usr/bin/true 2>/dev/null \
            || sudo softwareupdate --install-rosetta --agree-to-license

      # A keychain of this run's own: the certificate never touches the
      # runner's login keychain, and goes away with the runner.
      - name: Take the signing certificate into a keychain
        if: env.MACOS_CERT_P12 != ''
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/hopdesk-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this, codesign stops to ask for the key and the build hangs.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          # codesign will not sign with an identity it cannot build a chain
          # for, and a certificate of our own has no chain to build - it is its
          # own root. So the runner is told to trust it, for code signing only.
          # It is trusted on this runner, for these few minutes, and nowhere
          # else: what a Mac installing the app makes of it is a separate
          # question, answered by Gatekeeper, which still asks.
          security find-certificate -c "$SIGN_IDENTITY" -p "$KEYCHAIN" > "$RUNNER_TEMP/signer.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signer.pem"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -F "$SIGN_IDENTITY"

      - name: Build the .dmg
        env:
          HOPDESK_MAC_ARCH: ${{ matrix.arch }}
          # electron-builder must not go looking: the identity is chosen here.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          HOPDESK_SIGN_IDENTITY: ${{ env.MACOS_CERT_P12 != '' && env.SIGN_IDENTITY || '' }}
        run: bash packaging/build-macos.sh

      - name: Check the bundle's architecture and signature
        run: |
          set -euo pipefail
          DMG=$(ls dist-packages/HopDesk-*-${{ matrix.arch }}.dmg)
          echo "DMG=$DMG" >> "$GITHUB_ENV"
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/hopdesk-dmg "$DMG"
          ls -la /tmp/hopdesk-dmg
          NAME=$(basename "$(ls -d /tmp/hopdesk-dmg/*.app | head -1)")
          ditto "/tmp/hopdesk-dmg/$NAME" "$RUNNER_TEMP/Applications/$NAME"
          hdiutil detach /tmp/hopdesk-dmg
          APP="$RUNNER_TEMP/Applications/$NAME"
          echo "HOPDESK_MAC_APP=$APP" >> "$GITHUB_ENV"
          EXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Contents/Info.plist")
          echo "bundle $NAME, executable $EXE"
          want=$([ "${{ matrix.arch }}" = x64 ] && echo x86_64 || echo arm64)
          lipo -archs "$APP/Contents/MacOS/$EXE" | tee /dev/stderr | grep -qw "$want"
          KOFFI=$(find "$APP/Contents/Resources" -name koffi.node -path "*darwin_${{ matrix.arch }}*" | head -1)
          test -n "$KOFFI" || { echo "koffi's darwin-${{ matrix.arch }} module is not in the bundle" >&2; exit 1; }
          lipo -archs "$KOFFI" | tee /dev/stderr | grep -qw "$want"
          # A valid signature: without one Apple Silicon calls the app damaged.
          codesign --verify --deep --strict --verbose=2 "$APP"
          if [ -n "$MACOS_CERT_P12" ]; then
            # Signed by our certificate, and - the point of the exercise - the
            # rule macOS will recognise it by names the certificate rather than
            # this build's hash, so an update keeps its permissions.
            codesign -dvvv "$APP" 2>&1 | tee /dev/stderr | grep -q "Authority=$SIGN_IDENTITY"
            codesign --display --requirements - "$APP" 2>&1 | tee /dev/stderr | grep -q 'certificate leaf'
          else
            codesign -dv "$APP" 2>&1 | tee /dev/stderr | grep -q "Signature=adhoc"
          fi

      - name: Start the installed app
        run: |
          HOPDESK_REQUIRE_PACKAGE=1 \
            node --test --test-timeout=360000 apps/desktop/test/packaged-macos.test.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: ${{ env.DMG }}
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [linux, macos]
    # success(): a custom condition otherwise replaces "only if every build passed".
    if: success() && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Checksums
        working-directory: packages
        run: |
          ls -la
          sha256sum *.AppImage *.deb *.dmg | tee SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cat > /tmp/notes.md <<'NOTES'
          ## Install

          **Mac** — download the `.dmg` for your Mac: `arm64` for Apple Silicon
          (M1 and later), `x64` for Intel. Not sure? Apple menu → About This Mac:
          "Chip: Apple M…" means arm64, "Processor: Intel" means x64.

          1. Open the `.dmg` and drag HopDesk into Applications.
          2. Open HopDesk from Applications. macOS says it cannot check it for
             malicious software, because this build is not signed with an Apple
             Developer ID. Click **Done** (not Move to Bin).
          3. Open **System Settings → Privacy & Security**, scroll to the
             message about HopDesk, click **Open Anyway**, and confirm with your
             password. After this once, HopDesk opens normally.
          4. In HopDesk, **This computer** lists Screen Recording and
             Accessibility. For each one marked "Not allowed", press its button,
             switch HopDesk on, and come back. Screen Recording needs HopDesk to
             restart — the **Reopen HopDesk** button does it.

          Each new version is a new unsigned app to macOS, so expect to repeat
          step 3. macOS also ties each permission to the version that was given
          it, which is why a switch left on from an older HopDesk does nothing
          for a new one. HopDesk clears those on its first run, so macOS asks
          again. If a switch is on and HopDesk still says "Not allowed",
          **Start over** in its setup screen clears them by hand.

          **Debian, Ubuntu, Mint, Pop!_OS** — download the `.deb` and:

              sudo apt install ./hopdesk_*_amd64.deb

          **Any other Linux** — download the `.AppImage`, then
          `chmod +x HopDesk-*.AppImage` and run it. If it complains about FUSE,
          install `libfuse2` or run it with `--appimage-extract-and-run`.

          Verify a download against `SHA256SUMS.txt`:

              sha256sum -c SHA256SUMS.txt --ignore-missing

          ## What is tested in this build

          - Linux: both packages were built and started on a real X display,
            with two packaged copies connecting and one controlling the other.
          - Mac: each `.dmg` was installed and started on a GitHub Mac, its
            architecture and signature checked, and its input backend loaded.
            A CI Mac cannot be given Screen Recording or Accessibility, so
            sharing a Mac's screen and controlling it have **not** been tested
            by this build.

          ## Sharing a computer with two screens

          Only one screen is shared at a time - Chromium captures a monitor,
          not the desktop as a whole - so windows on the other monitor are not
          in the picture at all. **This computer → Screen to share** chooses
          which, and anyone watching sees the change straight away.

          ## What is not

          - **Linux on Wayland cannot share its whole screen.** Log into an Xorg
            session to host, or host from the other machine.
          - **No Windows package.** There is no Host backend for Windows.
          NOTES

          FILES=(packages/*.AppImage packages/*.deb packages/*.dmg packages/SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; replacing its files."
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "HopDesk $TAG" \
              --notes-file /tmp/notes.md \
              "${FILES[@]}"
          fi
          echo "Download page: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
